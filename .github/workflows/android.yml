name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Valid Gradle Wrapper
        run: |
          if ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
            echo "Gradle wrapper JAR is missing or corrupt. Regenerating wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Generate Debug Keystore if Missing
        run: |
          if [ ! -f ./debug.keystore ]; then
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
