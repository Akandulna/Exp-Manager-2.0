name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Publish Latest Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Valid Gradle Wrapper
        run: |
          if ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
            echo "Gradle wrapper JAR is missing or corrupt. Regenerating wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Restore Persistent Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ./debug.keystore
            echo "Persistent keystore successfully restored from GitHub Secrets."
          elif [ -f ./debug.keystore ]; then
            echo "Using existing repository debug.keystore."
          else
            echo "Generating fallback keystore..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish or Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Latest Build (v1.0.${{ github.run_number }})"
          body: "Auto-generated latest build APK from commit ${{ github.sha }}."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

